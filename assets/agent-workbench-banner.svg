<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workbench</title>
  <desc id="desc">A curated skill library for AI coding agents, with workflows spanning explore, plan, build, verify, review and ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset=".55" stop-color="#10172d"/><stop offset="1" stop-color="#17102b"/></linearGradient>
    <radialGradient id="glowA"><stop stop-color="#6d4aff" stop-opacity=".34"/><stop offset="1" stop-color="#6d4aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop stop-color="#26c6da" stop-opacity=".18"/><stop offset="1" stop-color="#26c6da" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#77d6ff"/><stop offset=".5" stop-color="#9b83ff"/><stop offset="1" stop-color="#e19aff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18233f" stop-opacity=".96"/><stop offset="1" stop-color="#0b1328" stop-opacity=".96"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <ellipse cx="520" cy="250" rx="580" ry="350" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1340" cy="320" rx="430" ry="300" fill="url(#glowB)" filter="url(#soft)"/>
  <g opacity=".12" stroke="#8aa4dd" stroke-width="1">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
    <path d="M80 0V560M160 0V560M240 0V560M320 0V560M400 0V560M480 0V560M560 0V560M640 0V560M720 0V560M800 0V560M880 0V560M960 0V560M1040 0V560M1120 0V560M1200 0V560M1280 0V560M1360 0V560M1440 0V560M1520 0V560"/>
  </g>
  <rect x="48" y="42" width="62" height="62" rx="17" fill="#101a35" stroke="url(#accent)" stroke-width="2.5"/>
  <path d="M68 61L84 73L68 85M90 86H99" fill="none" stroke="#c7baff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="84" fill="#f4f6ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="750" letter-spacing="-.8">Agent Workbench</text>
  <rect x="555" y="54" width="115" height="30" rx="15" fill="#201b45" stroke="#7562ce"/>
  <text x="612" y="74" fill="#d8ceff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">OPEN TOOLKIT</text>
  <text x="52" y="190" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="760" letter-spacing="-1.6">Think clearly.</text>
  <text x="52" y="255" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="760" letter-spacing="-1.6">Build deliberately.</text>
  <text x="52" y="320" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="760" letter-spacing="-1.6">Ship with confidence.</text>
  <text x="56" y="374" fill="#bdc8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">A curated library of everyday skills and specialist agent roles</text>
  <text x="56" y="405" fill="#bdc8df" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">for coding, software delivery, research, and more.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="650" font-size="16">
    <rect x="54" y="452" width="154" height="48" rx="12" fill="#182443" stroke="#6b74c9"/><text x="131" y="482" fill="#f2f4ff" text-anchor="middle">50 SKILLS</text>
    <rect x="222" y="452" width="190" height="48" rx="12" fill="#182443" stroke="#8b6cce"/><text x="317" y="482" fill="#f2f4ff" text-anchor="middle">10 AGENT ROLES</text>
    <rect x="426" y="452" width="164" height="48" rx="12" fill="#102c32" stroke="#3caa9b"/><text x="508" y="482" fill="#e3fff7" text-anchor="middle">5 TEMPLATES</text>
    <rect x="604" y="452" width="236" height="48" rx="12" fill="#19233b" stroke="#617ca5"/><text x="722" y="482" fill="#e4edff" text-anchor="middle">CLAUDE CODE · CODEX</text>
  </g>
  <g transform="translate(900 105)">
    <rect x="-12" y="-12" width="630" height="370" rx="22" fill="#000" opacity=".38" filter="url(#shadow)"/>
    <rect width="610" height="350" rx="20" fill="url(#panel)" stroke="#475d91" stroke-width="1.5"/>
    <rect width="610" height="48" rx="20" fill="#1b2746"/>
    <path d="M0 48H610" stroke="#445a85"/>
    <circle cx="27" cy="24" r="6" fill="#ff7185"/><circle cx="48" cy="24" r="6" fill="#ffc66d"/><circle cx="69" cy="24" r="6" fill="#55d6a0"/>
    <text x="98" y="30" fill="#cbd8f6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15">agent-workbench / workflow</text>
    <text x="28" y="88" fill="#9caed3" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">$ select_workflow --task "ship a reliable change"</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="25" y="112" width="560" height="47" rx="10" fill="#1a2a4a" stroke="#465b89"/>
      <circle cx="51" cy="135" r="11" fill="#7065ce"/><path d="M46 135L50 139L57 130" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="76" y="141" fill="#ecf1ff" font-size="17" font-weight="650">Explore the codebase and define the task</text>
      <rect x="25" y="170" width="560" height="47" rx="10" fill="#1a2a4a" stroke="#465b89"/>
      <circle cx="51" cy="193" r="11" fill="#7065ce"/><path d="M46 193L50 197L57 188" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="76" y="199" fill="#ecf1ff" font-size="17" font-weight="650">Plan a small, testable implementation</text>
      <rect x="25" y="228" width="560" height="47" rx="10" fill="#1a2a4a" stroke="#465b89"/>
      <circle cx="51" cy="251" r="11" fill="#7065ce"/><path d="M46 251L50 255L57 246" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="76" y="257" fill="#ecf1ff" font-size="17" font-weight="650">Build, test, review, and document</text>
      <rect x="25" y="286" width="560" height="42" rx="10" fill="#102e37" stroke="#2f9f91"/>
      <path d="M47 305L54 312L66 298" stroke="#64e4bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="313" fill="#caffed" font-size="16" font-weight="700">Ready for a verified handoff</text>
    </g>
  </g>
  <text x="1540" y="530" text-anchor="end" fill="#8290ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1.5">MODULAR · PORTABLE · EVIDENCE-DRIVEN</text>
</svg>
