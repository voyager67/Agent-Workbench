<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="310" viewBox="0 0 1440 310" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workbench workflow</title>
  <desc id="desc">Six reusable stages: explore, plan, build, verify, review, and ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#15132b"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67d8ff"/><stop offset=".5" stop-color="#9b83ff"/><stop offset="1" stop-color="#58d8b5"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2948"/><stop offset="1" stop-color="#10182d"/></linearGradient>
  </defs>
  <rect width="1440" height="310" rx="22" fill="url(#bg)"/>
  <text x="48" y="52" fill="#f1f4ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="750">One library. A complete working loop.</text>
  <text x="48" y="80" fill="#aab8d7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Select the smallest set of skills that fits the task — these stages are reusable, not mandatory gates.</text>
  <path d="M138 168H1300" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".72"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(35 110)"><rect width="198" height="133" rx="15" fill="url(#card)" stroke="#4c8cae"/><circle cx="30" cy="30" r="17" fill="#21435c" stroke="#65c9ec"/><text x="30" y="36" text-anchor="middle" fill="#dff8ff" font-size="16" font-weight="700">1</text><text x="58" y="36" fill="#e9f4ff" font-size="19" font-weight="700">Explore</text><text x="18" y="74" fill="#aebbd5" font-size="14">Understand the repo,</text><text x="18" y="95" fill="#aebbd5" font-size="14">context, and goal.</text></g>
    <g transform="translate(272 110)"><rect width="198" height="133" rx="15" fill="url(#card)" stroke="#7667c1"/><circle cx="30" cy="30" r="17" fill="#382e68" stroke="#a18cff"/><text x="30" y="36" text-anchor="middle" fill="#f1eaff" font-size="16" font-weight="700">2</text><text x="58" y="36" fill="#f0eaff" font-size="19" font-weight="700">Plan</text><text x="18" y="74" fill="#b9b3d7" font-size="14">Clarify scope, risks,</text><text x="18" y="95" fill="#b9b3d7" font-size="14">and acceptance checks.</text></g>
    <g transform="translate(509 110)"><rect width="198" height="133" rx="15" fill="url(#card)" stroke="#8b70cb"/><circle cx="30" cy="30" r="17" fill="#47346d" stroke="#c29bff"/><text x="30" y="36" text-anchor="middle" fill="#f7edff" font-size="16" font-weight="700">3</text><text x="58" y="36" fill="#f1eaff" font-size="19" font-weight="700">Build</text><text x="18" y="74" fill="#beb4d9" font-size="14">Make the smallest</text><text x="18" y="95" fill="#beb4d9" font-size="14">maintainable change.</text></g>
    <g transform="translate(746 110)"><rect width="198" height="133" rx="15" fill="url(#card)" stroke="#348f95"/><circle cx="30" cy="30" r="17" fill="#174b52" stroke="#50d1c5"/><text x="30" y="36" text-anchor="middle" fill="#e0fffb" font-size="16" font-weight="700">4</text><text x="58" y="36" fill="#e1fffa" font-size="19" font-weight="700">Verify</text><text x="18" y="74" fill="#a9d2d2" font-size="14">Run checks and inspect</text><text x="18" y="95" fill="#a9d2d2" font-size="14">the actual results.</text></g>
    <g transform="translate(983 110)"><rect width="198" height="133" rx="15" fill="url(#card)" stroke="#9b7a4d"/><circle cx="30" cy="30" r="17" fill="#554027" stroke="#e2b36f"/><text x="30" y="36" text-anchor="middle" fill="#fff3dd" font-size="16" font-weight="700">5</text><text x="58" y="36" fill="#fff2df" font-size="19" font-weight="700">Review</text><text x="18" y="74" fill="#d6c1a3" font-size="14">Check quality, security,</text><text x="18" y="95" fill="#d6c1a3" font-size="14">and scope.</text></g>
    <g transform="translate(1220 110)"><rect width="185" height="133" rx="15" fill="url(#card)" stroke="#3c9d83"/><circle cx="30" cy="30" r="17" fill="#174d43" stroke="#63d9b0"/><text x="30" y="36" text-anchor="middle" fill="#e0fff4" font-size="16" font-weight="700">6</text><text x="58" y="36" fill="#e4fff5" font-size="19" font-weight="700">Ship</text><text x="18" y="74" fill="#a9d9c9" font-size="14">Deliver with clear</text><text x="18" y="95" fill="#a9d9c9" font-size="14">evidence and handoff.</text></g>
  </g>
  <text x="48" y="280" fill="#8395b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Use research, data, documentation, integrations, and agent roles wherever the task needs them.</text>
</svg>
