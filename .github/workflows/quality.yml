name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and tests (Python 3.10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate skill manifests and source mapping
        run: python scripts/validate_skills.py
      - name: Check for duplicate skill routing
        run: python scripts/audit_skill_overlap.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
